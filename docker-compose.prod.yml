services:
  minio:
    image: minio/minio:latest
    container_name: face-minio-prod
    ports:
      - "9017:9000"
      - "9018:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/minio_data
    command: server /minio_data --console-address ":9001"
    networks:
      - face-analysis
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: face-api-prod
    ports:
      - "9015:8000"
    environment:
      - PYTHONPATH=/app
      - ENV=production
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-face-analysis}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
    volumes:
      - ./resultado_api:/app/resultado_api
      - ./bkp:/app/bkp
    networks:
      - face-analysis
    depends_on:
      minio:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: face-frontend-prod
    ports:
      - "9016:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - face-analysis
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  face-analysis:
    driver: bridge

volumes:
  api-data:
    driver: local
  minio-data:
    driver: local