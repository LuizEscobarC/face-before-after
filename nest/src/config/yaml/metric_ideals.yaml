    direction_label_below:
      pt-BR: "terço inferior reduzido"

  dominant_third:
    ideal_type: presentation_only
    ideal_central_value: 0.0      # não há "central" para métrica apresentacional
    green_range_min: -0.0         # não usado em scoring
    green_range_max:  0.0
    yellow_range_min: -0.0
    yellow_range_max:  0.0
    direction_label_above:
      pt-BR: "terço dominante pelo desvio"
    direction_label_below:
      pt-BR: "terço dominante pelo desvio"

  # ──────────────────────────────────────────────
  # FAMÍLIA: fifths
  # ──────────────────────────────────────────────

  fifth_1_ratio:
    ideal_type: canonical
    ideal_central_value: 0.20
    green_range_min: 0.17
    green_range_max: 0.23
    yellow_range_min: 0.14
    yellow_range_max: 0.26
