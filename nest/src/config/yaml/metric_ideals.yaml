# metric_ideals.yaml
# Versão: v1.0 — M1 (canonical, literatura aberta — Farkas adiado para M2+)
#
# Estrutura por entrada:
#   ideal_central_value : float — valor alvo (na unidade da métrica)
#   ideal_type          : canonical | population_statistical | presentation_only
#   green_range_min/max : faixa verde (neutral/ideal)
#   yellow_range_min/max: faixa amarela (mild/moderate)
#   direction_label_above: { "pt-BR": "..." } — quando value > ideal_central_value
#   direction_label_below: { "pt-BR": "..." } — quando value < ideal_central_value
#
# Faixas implícitas de severity_5:
#   ideal    → [green_range_min, green_range_max]
#   mild     → [yellow_range_min, yellow_range_min) ∪ (yellow_range_max, green_range_max]
#              (logo além do verde, ainda no amarelo)
#   moderate → [yellow_range_min, yellow_range_max] (fora do verde)
#   strong   → além do amarelo até 2× o half-width do amarelo
#   extreme  → além do forte
# A classificação exacta é de responsabilidade do SeverityClassifier,
# que usa deviation_normalized = (value - ideal_central) / green_half_width.
#
# Unidades:
#   ratio                → eye_aperture, intercanthal, fifth ratios
#   intercanthal_units   → interpupillary_distance, intercanthal_distance
#   degrees              → canthal_tilt, brow angles
#   index_0_1            → midline_deviation, asymmetry_index

version: "v1.0"

metrics:

  # ──────────────────────────────────────────────
  # FAMÍLIA: symmetry
  # ──────────────────────────────────────────────

  midline_deviation:
    ideal_type: canonical
    ideal_central_value: 0.0
    green_range_min: -0.05
    green_range_max:  0.05
    yellow_range_min: -0.15
    yellow_range_max:  0.15
    direction_label_above:
      pt-BR: "desvio para a direita"
    direction_label_below:
      pt-BR: "desvio para a esquerda"

  eye_height_asymmetry:
    ideal_type: canonical
    ideal_central_value: 0.0
    green_range_min: -0.05
    green_range_max:  0.05
    yellow_range_min: -0.15
    yellow_range_max:  0.15
    direction_label_above:
      pt-BR: "olho esquerdo mais alto"
    direction_label_below:
      pt-BR: "olho direito mais alto"

  brow_height_asymmetry:
    ideal_type: canonical
    ideal_central_value: 0.0
    green_range_min: -0.05
    green_range_max:  0.05
    yellow_range_min: -0.15
    yellow_range_max:  0.15
    direction_label_above:
      pt-BR: "sobrancelha esquerda mais alta"
    direction_label_below:
      pt-BR: "sobrancelha direita mais alta"

  lip_canting_angle:
    ideal_type: canonical
    ideal_central_value: 0.0
    green_range_min: -1.0
    green_range_max:  1.0
    yellow_range_min: -3.0
    yellow_range_max:  3.0
    direction_label_above:
      pt-BR: "canto labial esquerdo mais alto"
    direction_label_below:
      pt-BR: "canto labial direito mais alto"

  global_asymmetry_index:
    ideal_type: canonical
    ideal_central_value: 0.0
    green_range_min: 0.0
    green_range_max: 0.05
    yellow_range_min: 0.0
    yellow_range_max: 0.15
    direction_label_above:
      pt-BR: "assimetria global elevada"
    direction_label_below:
      pt-BR: "assimetria global mínima"

  # ──────────────────────────────────────────────
  # FAMÍLIA: thirds
  # ──────────────────────────────────────────────

  upper_third_ratio:
    ideal_type: canonical
    ideal_central_value: 0.333
    green_range_min: 0.300
    green_range_max: 0.367
    yellow_range_min: 0.267
    yellow_range_max: 0.400
    direction_label_above:
      pt-BR: "terço superior dominante"
    direction_label_below:
      pt-BR: "terço superior reduzido"

  middle_third_ratio:
    ideal_type: canonical
    ideal_central_value: 0.333
    green_range_min: 0.300
    green_range_max: 0.367
    yellow_range_min: 0.267
    yellow_range_max: 0.400
    direction_label_above:
      pt-BR: "terço médio dominante"
    direction_label_below:
      pt-BR: "terço médio reduzido"

  lower_third_ratio:
    ideal_type: canonical
    ideal_central_value: 0.333
