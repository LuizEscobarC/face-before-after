# metric_ideals.yaml
# Versão: v1.0 — M1 (canonical, literatura aberta — Farkas adiado para M2+)
#
# Estrutura por entrada:
#   ideal_central_value : float — valor alvo (na unidade da métrica)
#   ideal_type          : canonical | population_statistical | presentation_only
#   green_range_min/max : faixa verde (neutral/ideal)
#   yellow_range_min/max: faixa amarela (mild/moderate)
#   direction_label_above: { "pt-BR": "..." } — quando value > ideal_central_value
#   direction_label_below: { "pt-BR": "..." } — quando value < ideal_central_value
#
# Faixas implícitas de severity_5:
#   ideal    → [green_range_min, green_range_max]
#   mild     → [yellow_range_min, yellow_range_min) ∪ (yellow_range_max, green_range_max]
#              (logo além do verde, ainda no amarelo)
#   moderate → [yellow_range_min, yellow_range_max] (fora do verde)
#   strong   → além do amarelo até 2× o half-width do amarelo
#   extreme  → além do forte
# A classificação exacta é de responsabilidade do SeverityClassifier,
# que usa deviation_normalized = (value - ideal_central) / green_half_width.
#
# Unidades:
#   ratio                → eye_aperture, intercanthal, fifth ratios
#   intercanthal_units   → interpupillary_distance, intercanthal_distance
#   degrees              → canthal_tilt, brow angles
#   index_0_1            → midline_deviation, asymmetry_index

