    ideal_central_value: 1.0
    green_range_min: 0.85
    green_range_max: 1.15
    yellow_range_min: 0.70
    yellow_range_max: 1.30
    direction_label_above:
      pt-BR: "distância intercantal relativamente ampla"
    direction_label_below:
      pt-BR: "distância intercantal relativamente estreita"

  # ──────────────────────────────────────────────
  # FAMÍLIA: eyes
  # ──────────────────────────────────────────────

  eye_aperture_ratio_l:
