# Region metric weights — v1.0 (PR-12 / M2 first slice)
#
# Per DEC-6: presentation_only metrics MUST NOT appear here. The scorer
# enforces this by hard assertion, but we also exclude them from the YAML.
# Per DEC-1: weights are unitless multipliers applied to (1 - |deviation_normalized|)
# inside the regional aggregator (see RegionalScorer).
#
# In M1 only two regions are populated: 'symmetry' and 'eyes' (15 + 6 metrics).
# Other regions enter in M2 sequels.
version: v1.0
description: "M1 baseline weights — single-photo, intercanthal-normalized."
is_active: true
weights:
  symmetry:
    # core symmetry family
    midline_deviation: 1.5
    eye_height_asymmetry: 1.0
    brow_height_asymmetry: 1.0
    lip_canting_angle: 1.0
    global_asymmetry_index: 2.0
    # vertical thirds (proportion sub-family living under symmetry region in M1)
    upper_third_ratio: 1.0
    middle_third_ratio: 1.0
    lower_third_ratio: 1.0
    # dominant_third intentionally omitted — presentation_only/categorical
    # horizontal fifths
    fifth_1_ratio: 0.8
    fifth_2_ratio: 0.8
    fifth_3_ratio: 0.8
    fifth_4_ratio: 0.8
    fifth_5_ratio: 0.8
    intercanthal_to_eye_width_ratio: 1.0
  eyes:
    eye_aperture_ratio_l: 1.0
    eye_aperture_ratio_r: 1.0
    interpupillary_distance: 1.5
    intercanthal_distance: 0.5  # sanity-check metric — kept low
    canthal_tilt_l: 1.0
    canthal_tilt_r: 1.0
  jaw:
    # PR-13 (M2 jaw family). Bumped weight on width_ratio + asymmetry per DEC-8
    # (jaw is critical region; width and asymmetry carry the strongest signal).
    jaw_width_ratio: 1.5
    gonial_angle_l: 1.0
    gonial_angle_r: 1.0
    gonial_angle_asymmetry: 1.2
    mandibular_plane_angle: 1.0
    chin_height_ratio: 1.0
  nose:
    # PR-14 (M2 nose family). Slight bump on width and deviation metrics:
    # asymmetry and dorsum displacement carry strong perceptual signal.
    nose_length_to_icd: 1.0
    nose_width_to_icd: 1.2
    alar_to_face_width_ratio: 1.0
    nose_to_mouth_width_ratio: 1.0
    dorsum_deviation: 1.3
    nasal_tip_deviation: 1.3
    alar_base_asymmetry: 1.2
  mouth:
    # PR-15 (M2 mouth family). Higher weight on canting + midline_deviation
    # (asymmetry signals carry strong perceptual weight per DEC-8 rationale).
    mouth_width_to_icd: 1.0
    mouth_to_face_width_ratio: 1.0
    upper_lip_height_ratio: 1.0
    lower_lip_height_ratio: 1.0
    vermilion_height_total: 1.1
    lip_corner_canting: 1.3
    mouth_midline_deviation: 1.2
  brows:
    # PR-16 (M2 brows family). Higher weight on tail_drop (tail droop is a
    # major aesthetic signal; Naini 2011). brow_thickness_l/r are
    # presentation_only and intentionally excluded (DEC-6).
    brow_height_l: 1.0
    brow_height_r: 1.0
    brow_arch_peak_l: 1.0
    brow_arch_peak_r: 1.0
    brow_tail_drop_l: 1.2
    interbrow_distance_ratio: 1.1

  cheekbones:
    # PR-17 (M2 cheekbones family). malar_projection_index weighted higher
    # (main lateral prominence signal). cheekbone_to_jaw carries aesthetic
    # importance for facial contour (taper signal).
    zygomatic_width_ratio: 1.0
    malar_projection_index: 1.2
    midface_height_ratio: 1.0
    cheekbone_to_jaw_ratio: 1.1
    submalar_hollow_index: 1.0

  forehead:
    # PR-18 (M2 forehead family). temporal_width_ratio weighted slightly higher
    # (temporal crest width is the primary shape-defining signal for forehead form).
    # hairline_curvature_index excluded — requires pixel analysis (DEC-10).
    forehead_height_ratio: 1.0
    forehead_width_ratio: 1.0
    temporal_width_ratio: 1.1

  global:
    # PR-19 (M2 global_shape family). face_height_to_width_ratio weighted higher
    # (primary face-shape signal; Farkas ratio strongly predicts face shape category).
    # total_facial_convexity at 0.8 (secondary signal; mainly captures temporal hollowing).
    # face_shape_classification excluded — presentation_only=true (DEC-6).
    # e_line_deviation excluded — requires_pixel_analysis=true stub (DEC-10).
    face_height_to_width_ratio: 1.3
    total_facial_convexity: 0.8
    # FAMÍLIA: phi — EXCLUÍDA INTENCIONALMENTE (presentation_only=True, DEC-6)
    # phi_face_height_to_width, phi_lower_face_segments, phi_eye_to_mouth,
    # phi_nose_to_lip são overlays decorativos áureos e NÃO recebem pesos.
    # φ ≠ média populacional (Farkas 1994); ver migration 1746000130000-SeedPhiGoldenFamily.ts.
