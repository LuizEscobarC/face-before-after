services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: face-api
    ports:
      - "9015:8000"
    environment:
      - PYTHONPATH=/app
      - ENV=development
    volumes:
      - ./resultado_api:/app/resultado_api
      - ./bkp:/app/bkp

    networks:
      - face-analysis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: face-frontend
    ports:
      - "9016:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - face-analysis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  face-analysis:
    driver: bridge

volumes:
  api-data:
    driver: local