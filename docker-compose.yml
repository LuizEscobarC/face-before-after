services:
  minio:
    image: minio/minio:latest
    container_name: face-minio
    ports:
      - "9017:9000"
      - "9018:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-beforeafter}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-beforeafter}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - face-analysis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: face-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - face-analysis
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-beforeafter}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-beforeafter}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-face-analysis}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$MINIO_BUCKET_NAME &&
        mc anonymous set download local/$$MINIO_BUCKET_NAME &&
        echo 'Bucket $$MINIO_BUCKET_NAME criado com sucesso.'
      "
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      # Build context is root so Dockerfile can access both backend/ and entrypoint.sh
    container_name: face-api
    ports:
      - "9015:8000"
    environment:
      - PYTHONPATH=/app:/app/site-packages
      - ENV=development
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-beforeafter}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-beforeafter}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-face-analysis}
      - MINIO_USE_SSL=false
    volumes:
      - ./resultado_api:/app/resultado_api
      - ./bkp:/app/bkp
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - face-analysis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: face-frontend
    ports:
      - "9016:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - face-analysis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  face-analysis:
    driver: bridge

volumes:
  api-data:
    driver: local
  minio-data:
    driver: local