name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.105.53.118
          username: root
          key: ${{ secrets.SSH_KEY }}
          timeout: 600s
          command_timeout: 300s
          script: |
            export PATH="/root/bin:$PATH"
            cd /root/app/face-before-after
            git pull origin main
            just docker-build
            just docker-up